{{- $root := . -}}
{{- range $name, $comp := ( .Values.components | default dict ) }}
{{- if and $comp.configMap $comp.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inres.componentFullname" (dict "root" $root "name" $name) }}-config
  labels:
    {{- include "inres.componentLabels" (dict "root" $root "name" $name) | nindent 4 }}
data:
  {{- if eq $name "kong" }}
  temp.yml: |
    _format_version: '2.1'
    _transform: true

    ###
    ### Consumers / Users
    ###
    consumers:
      - username: DASHBOARD

    ###
    ### API Routes
    ###
    services:
      ## API Service - Main Backend API
      - name: api-service
        _comment: 'API: /api/* -> http://{{ include "inres.componentFullname" (dict "root" $root "name" "api") }}:8080/*'
        url: http://{{ include "inres.componentFullname" (dict "root" $root "name" "api") }}:8080/
        routes:
          - name: api-routes
            strip_path: true
            paths:
              - /api
        plugins:
          - name: cors

      ## Inbound webhooks (Alertmanager, Datadog, Grafana, PagerDuty, Coralogix, ...)
      ##
      ## The API serves these at /webhook/:type/:id and /webhooks/* - not under
      ## /api - and that is the shape the README documents and that the
      ## integration UI generates. Without this route those URLs fall through to
      ## the web catch-all and every alert source gets a Next.js 404, silently.
      ## strip_path is false so the API sees the same path the sender used.
      ## (The old Gloo template carried routePrefix "/webhook/*" for this exact
      ## reason.) /webhook is a prefix match, so it also covers /webhooks.
      - name: webhook-service
        _comment: 'Webhooks: /webhook/* and /webhooks/* -> http://{{ include "inres.componentFullname" (dict "root" $root "name" "api") }}:8080/webhook*'
        url: http://{{ include "inres.componentFullname" (dict "root" $root "name" "api") }}:8080/
        routes:
          - name: webhook-routes
            strip_path: false
            paths:
              - /webhook
              - /webhooks
        plugins:
          - name: cors

      ## AI Service
      - name: ai-service
        _comment: 'AI: /ai/* -> http://{{ include "inres.componentFullname" (dict "root" $root "name" "ai") }}:8002/*'
        url: http://{{ include "inres.componentFullname" (dict "root" $root "name" "ai") }}:8002/
        routes:
          - name: ai-routes
            strip_path: true
            paths:
              - /ai/
        plugins:
          - name: cors

      ## WebSocket for AI Chat
      - name: ai-websocket
        _comment: 'WebSocket: /ws/chat -> ws://{{ include "inres.componentFullname" (dict "root" $root "name" "ai") }}:8002/ws/chat'
        url: http://{{ include "inres.componentFullname" (dict "root" $root "name" "ai") }}:8002
        protocol: ws
        routes:
          - name: ai-ws-route
            strip_path: false
            paths:
              - /ws/chat
        plugins:
          - name: cors


      ## Supabase Auth (GoTrue)
      ##
      ## Must stay ahead of the catch-all "/" route below. Kong prefers the
      ## longer prefix, so /auth/v1 wins over / the same way /api already does;
      ## with no route here at all those calls reach the web upstream instead
      ## and supabase-js sees a Next.js 404 for every sign-in and sign-up.
      {{- if and $root.Values.supabase $root.Values.supabase.auth $root.Values.supabase.auth.enabled }}
      - name: auth-service
        _comment: 'GoTrue: /auth/v1/* -> {{ $root.Values.supabase.auth.url }}/*'
        url: {{ $root.Values.supabase.auth.url }}/
        routes:
          - name: auth-v1-routes
            ## strip_path so /auth/v1/token reaches GoTrue as /token, which is
            ## the rewrite Supabase's own Kong config performs.
            strip_path: true
            paths:
              - /auth/v1
        plugins:
          - name: cors
      {{- end }}

      {{- if and $root.Values.supabase $root.Values.supabase.storage $root.Values.supabase.storage.enabled }}
      ## Supabase Storage
      - name: storage-service
        _comment: 'Storage: /storage/v1/* -> {{ $root.Values.supabase.storage.url }}/*'
        url: {{ $root.Values.supabase.storage.url }}/
        routes:
          - name: storage-v1-routes
            strip_path: true
            paths:
              - /storage/v1
        plugins:
          - name: cors
      {{- end }}

      {{- if and $root.Values.supabase $root.Values.supabase.realtime $root.Values.supabase.realtime.enabled }}
      ## Supabase Realtime (WebSocket)
      - name: realtime-service
        _comment: 'Realtime: /realtime/v1/* -> {{ $root.Values.supabase.realtime.url }}/*'
        url: {{ $root.Values.supabase.realtime.url }}/
        routes:
          - name: realtime-v1-routes
            strip_path: true
            paths:
              - /realtime/v1
        plugins:
          - name: cors
      {{- end }}

      ## Web Frontend
      - name: web-service
        _comment: 'Web: /* -> http://{{ include "inres.componentFullname" (dict "root" $root "name" "web") }}:3000/*'
        url: http://{{ include "inres.componentFullname" (dict "root" $root "name" "web") }}:3000/
        routes:
          - name: web-routes
            strip_path: false
            paths:
              - /
        plugins:
          - name: cors
  {{- end }}
---
{{- end }}
{{- end }}

{{/* MCP Config ConfigMap for AI component */}}
{{- if and .Values.components.ai .Values.components.ai.mcpConfig .Values.components.ai.mcpConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inres.componentFullname" (dict "root" . "name" "ai") }}-mcp-config
  labels:
    {{- include "inres.componentLabels" (dict "root" . "name" "ai") | nindent 4 }}
data:
  mcp_config.yaml: |
{{ .Values.components.ai.mcpConfig.data | indent 4 }}
---
{{- end }}

