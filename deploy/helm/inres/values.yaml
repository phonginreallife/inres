# Default values for InRes Helm Chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Default replica count for components (can be overridden per component)
replicaCount: 1

# Default image settings
image:
  repository: ghcr.io/phonginreallife/
  # "IfNotPresent", not "IfPresent". Kubernetes accepts only Always,
  # IfNotPresent and Never, and deployment.yaml's `| default "IfNotPresent"`
  # only fires on an empty value - so a wrong-but-present string went straight
  # into the manifest and every Deployment in the release was rejected.
  pullPolicy: IfNotPresent
  # Empty means "use Chart.AppVersion", so the chart version and the images it
  # deploys move together and cannot drift apart. Override per deploy with
  # --set image.tag=X. Never set this to "latest": a rollback then has nothing
  # to roll back to, and two nodes pulling at different times can run
  # different code.
  tag: ""

# Image pull secrets for private registries
imagePullSecrets: []

# Override chart name
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# Container security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Default service configuration
service:
  type: ClusterIP
  port: 80

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

gloo:
  enabled: false
  serviceName: inres-kong
  servicePort: 8000
  useHttp2: false
  gatewayLabels:
    app.kubernetes.io/name: inres-kong
    app.kubernetes.io/instance: inres-kong
    app.kubernetes.io/component: kong
  sslConfig:
    secretName: inres-ssl-cert
    namespace: inres
  domains:
    - inres.your-domain.com
  routePrefix: "/webhook/*"

# Default resource limits
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes
volumes: []

# Additional volume mounts
volumeMounts: []

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Migration job configuration
migration:
  enabled: false
  image:
    repository: migration:latest
    name: inres-migration
    tag: 1.0.1
    pullPolicy: Always
  backoffLimit: 3
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# Components configuration with persistent storage
components:
  ai:
    replicas: 1
    image:
      name: inres-agent
    # The agent is the slowest to become ready: it loads config, brings up MCP
    # servers and starts the audit service before uvicorn serves. startupProbe
    # covers that window so a slow boot is never mistaken for a failure, and
    # liveness is deliberately lax - a restart loop on a wedged dependency is
    # worse than a pod that is briefly unresponsive.
    startupProbe:
      httpGet: { path: /health, port: 8002 }
      periodSeconds: 5
      failureThreshold: 30
    readinessProbe:
      httpGet: { path: /health, port: 8002 }
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet: { path: /health, port: 8002 }
      periodSeconds: 20
      failureThreshold: 6
    service:
      enabled: true
      type: ClusterIP
      port: 8002
    env:
      # Required environment variables
      - name: PORT
        value: "8002"
      - name: HOST
        value: "0.0.0.0"
      - name: USER_WORKSPACES_DIR
        value: "/app/workspaces"
      # Lowercase "inres_" is deliberate: both the Go API
      # (server/api/cmd/server/main.go) and the Python agent
      # (server/agent/config/settings.py) read os.Getenv("inres_CONFIG_PATH").
      # Env lookups are case-sensitive, so INRES_CONFIG_PATH was silently
      # ignored and every component fell back to defaults.
      #
      # The path is /etc/inres, NOT /app/config: the agent image ships a Python
      # package at /app/config (__init__.py, loader.py, settings.py), and
      # mounting the secret there replaced it, so "from config import loader"
      # failed with "unknown location".
      - name: inres_CONFIG_PATH
        value: "/etc/inres/config.yaml"
    ingress:
      enabled: false

    # Requests are what the scheduler reserves, so they must fit on a single
    # node. Requesting a full 2 CPUs made this pod unschedulable on any node
    # smaller than roughly 2.5 vCPU - and because the cluster autoscaler
    # simulates against the same instance type, adding nodes never helped; the
    # pod just stayed Pending. Keep requests modest and let the limit absorb
    # the bursts, which is the shape of the workload anyway: the agent idles
    # until a CLI subprocess runs.
    resources:
      limits:
        cpu: "2"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
    # Persistent storage configuration for user workspaces
    persistence:
      enabled: true
      storageClass: "" # Use default storage class, or specify like "gp2", "standard", etc.
      accessMode: ReadWriteOnce
      size: 10Gi # Adjust size based on your needs
      mountPath: "/app/workspaces"

    # Persistent storage configuration for Claude data
    claudePersistence:
      enabled: true
      storageClass: "" # Use default storage class
      accessMode: ReadWriteOnce
      size: 5Gi # Adjust size based on your needs
      mountPath: "/root/.claude"

    # Volume mounts for the container
    volumeMounts:
      - name: ai-workspaces
        mountPath: /app/workspaces
      - name: ai-claude
        mountPath: /root/.claude
      - name: app-config
        mountPath: /etc/inres
        readOnly: true

    # Volumes definition
    volumes:
      - name: ai-workspaces
        persistentVolumeClaim:
          claimName: '{{ include "inres.componentFullname" (dict "root" . "name" "ai") }}-workspaces'
      - name: ai-claude
        persistentVolumeClaim:
          claimName: '{{ include "inres.componentFullname" (dict "root" . "name" "ai") }}-claude'
      - name: app-config
        secret:
          secretName: inres-secrets
          items:
            - key: config.yaml
              path: config.yaml

    # RBAC configuration for AI pod
    rbac:
      # Enable RBAC for AI pod to access Kubernetes resources
      enabled: true
      # Additional custom resources to grant read access (optional)
      # customResources:
      #   - apiGroups: ["custom.io"]
      #     resources: ["customresources"]

  api:
    image:
      name: inres-api
    startupProbe:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 5
      failureThreshold: 24
    readinessProbe:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 20
      failureThreshold: 6
    service:
      enabled: true
      type: ClusterIP
      port: 8080
    env:
      - name: PORT
        value: "8080"
      - name: INRES_ENV
        value: "production"
      - name: inres_CONFIG_PATH
        value: "/etc/inres/config.yaml"
    
    # Mount config file from secret
    volumeMounts:
      - name: app-config
        mountPath: /etc/inres
        readOnly: true
      - name: api-data
        mountPath: /app/data
    volumes:
      - name: app-config
        secret:
          secretName: inres-secrets
          items:
            - key: config.yaml
              path: config.yaml
      - name: api-data
        emptyDir: {}
    ingress:
      enabled: false

  # Standalone escalation/notification worker.
  #
  # Disabled by default, and not because it is unused: cmd/server already
  # starts StartIncidentWorker and StartNotificationWorker in-process, so
  # escalation runs today with zero replicas here. This Deployment exists to
  # move that work off the API pods when they are CPU-bound, and the workers
  # claim rows with FOR UPDATE SKIP LOCKED, so running both is safe rather
  # than double-escalating.
  #
  # Ships in the API image, which builds both binaries; only the command
  # differs. Set replicas to 1+ to scale workers independently.
  worker:
    replicas: 0
    image:
      name: inres-api
    command: ["./worker"]
    service:
      enabled: false
    env:
      - name: INRES_ENV
        value: "production"
      - name: inres_CONFIG_PATH
        value: "/etc/inres/config.yaml"
    volumeMounts:
      - name: app-config
        mountPath: /etc/inres
        readOnly: true
    volumes:
      - name: app-config
        secret:
          secretName: inres-secrets
          items:
            - key: config.yaml
              path: config.yaml
    resources:
      limits:
        cpu: "500m"
        memory: 256Mi
      requests:
        cpu: "100m"
        memory: 128Mi

  slack-worker:
    image:
      name: inres-slack-worker
    service:
      enabled: false
    env:
      - name: inres_CONFIG_PATH
        value: "/etc/inres/config.yaml"
      - name: POLL_INTERVAL
        value: "1"
      - name: BATCH_SIZE
        value: "10"
      - name: MAX_RETRIES
        value: "3"
      - name: LOG_LEVEL
        value: "DEBUG"
      - name: LOG_FILE
        value: "/app/slack_worker.log"
    
    # Mount config file from secret
    volumeMounts:
      - name: app-config
        mountPath: /etc/inres
        readOnly: true
    volumes:
      - name: app-config
        secret:
          secretName: inres-secrets
          items:
            - key: config.yaml
              path: config.yaml

  web:
    image:
      name: inres-frontend
    startupProbe:
      httpGet: { path: /, port: 3000 }
      periodSeconds: 5
      failureThreshold: 24
    readinessProbe:
      httpGet: { path: /, port: 3000 }
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet: { path: /, port: 3000 }
      periodSeconds: 20
      failureThreshold: 6
    service:
      enabled: true
      type: ClusterIP
      port: 3000

  kong:
    image:
      repository: kong
      tag: "2.8.1"
      pullPolicy: IfNotPresent
    # TCP rather than HTTP on purpose: GET / on the proxy port is forwarded to
    # the web upstream, so an HTTP probe would mark Kong unready whenever web
    # was down and take the whole ingress with it. A TCP check asks only
    # whether Kong itself is listening.
    startupProbe:
      tcpSocket: { port: 8000 }
      periodSeconds: 5
      failureThreshold: 24
    readinessProbe:
      tcpSocket: { port: 8000 }
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      tcpSocket: { port: 8000 }
      periodSeconds: 20
      failureThreshold: 6
    service:
      enabled: true
      type: ClusterIP
      port: 8000
      ports:
        - name: proxy
          port: 8000
          targetPort: 8000
          protocol: TCP
        - name: proxy-ssl
          port: 8443
          targetPort: 8443
          protocol: TCP
        - name: admin
          port: 8001
          targetPort: 8001
          protocol: TCP
    env:
      - name: KONG_DATABASE
        value: "off"
      - name: KONG_DECLARATIVE_CONFIG
        value: "/home/kong/kong.yml"
      - name: KONG_DNS_ORDER
        value: "LAST,A,CNAME"
      - name: KONG_PLUGINS
        value: "request-transformer,cors,key-auth,acl,basic-auth"
      - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
        value: "160k"
      - name: KONG_NGINX_PROXY_PROXY_BUFFERS
        value: "64 160k"
      # Dashboard credentials - override these in your values file or use secrets
      # Example with secretKeyRef:
      # - name: DASHBOARD_USERNAME
      #   valueFrom:
      #     secretKeyRef:
      #       name: kong-dashboard-credentials
      #       key: username
      # - name: DASHBOARD_PASSWORD
      #   valueFrom:
      #     secretKeyRef:
      #       name: kong-dashboard-credentials
      #       key: password
      - name: DASHBOARD_USERNAME
        value: "admin"  # CHANGE IN PRODUCTION - use secretKeyRef instead
      - name: DASHBOARD_PASSWORD
        value: ""  # MUST BE SET - use secretKeyRef in production
    configMap:
      enabled: true
      name: kong-config
