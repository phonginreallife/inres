# =============================================================================
# DATABASE & SERVER
# =============================================================================
database_url: "postgresql://postgres.<tenant>:<password>@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres"
port: "8080"
redis_url: ""

# =============================================================================
# URL CONFIGURATION
# =============================================================================
# inres_api_url: internal API URL for AI agent tools
inres_api_url: "http://inres-api:8080"

# inres_web_url: internal frontend URL
inres_web_url: "http://inres-web:3000"

# public_url: external URL for mobile/clients
public_url: "https://api.your-domain.com"

# webhook_api_base_url: the origin that alert sources (Alertmanager, Datadog,
# Grafana, PagerDuty, Coralogix, ...) can reach. The API bakes it into every
# integration's webhook URL at creation time and stores the result, so set it
# before creating integrations: with it empty every URL the UI hands out reads
# http://localhost:8080/webhook/..., and changing this later does not rewrite
# integrations that already exist. Use the public host; Kong routes /webhook
# straight to the API.
webhook_api_base_url: "https://your-domain.com"

# agent_url: AI Agent service URL
agent_url: "https://agent.your-domain.com"

# backend_url: Zero-Trust verifier URL
backend_url: "http://inres-api:8080"

data_dir: "./data"

# =============================================================================
# SUPABASE & AUTH
# =============================================================================
# Internal URL for API→Supabase communication (Docker container name)
supabase_url: "http://supabase_kong_supabase:8000"

# Public URL for frontend/browser
# When using HTTPS, route through nginx: https://your-domain.com
# Nginx will proxy /auth, /rest, /realtime, /storage to Supabase
public_supabase_url: "https://your-domain.com"

# Public key for frontend Supabase client (required)
supabase_anon_key: "sb_publishable_..."

# Service role key for backend operations (required)
supabase_service_role_key: "eyJ..."

# JWT secret (optional) - only needed for legacy HS256 tokens
# New projects use ES256/RS256 with JWKS public key verification
supabase_jwt_secret: ""

# =============================================================================
# NOTIFICATION GATEWAY (Cloudflare Worker)
# Optional: Only required for Mobile Push Notifications
# =============================================================================
notification_gateway:
  url: "https://your-worker.workers.dev"
  instance_id: "inst_..."
  api_token: "inres_tok_..."

# =============================================================================
# EXTERNAL INTEGRATIONS
# =============================================================================
anthropic_api_key: "sk-ant-..."
slack_bot_token: "xoxb-..."
slack_app_token: "xapp-..."

# =============================================================================
# AI INCIDENT ANALYTICS
# =============================================================================
ai_incident_analytics:
  enabled: true
  model: "sonnet"
  permission_mode: "default"
  setting_sources:
    - "project"
    - "user"
  allowed_tools:
    - "Bash(docker ps:*)"
    - "Bash(docker top:*)"
    - "Bash(docker stats:*)"
    - "Bash(docker logs:*)"
    - "Bash(docker inspect:*)"
    - "Bash(docker exec:*)"
    - "Read"
    - "Grep"
    - "Glob"

# =============================================================================
# INTERACTIVE CHAT AGENT (/ws/chat)
# =============================================================================
# Every value here can be overridden with an AI_AGENT_* environment variable,
# e.g. AI_AGENT_MODEL. Env wins over this file.
ai_agent:
  # Any model id the Claude Code CLI accepts, or an alias like "sonnet".
  model: "claude-opus-5"

  permission_mode: "default"

  # Ask the user before running a tool that isn't already allow-listed.
  # Per-user allowances come from the user_allowed_tools table.
  require_tool_approval: true

  # How long an approval prompt waits before being denied, in seconds.
  permission_timeout_s: 300

  # Shut down the CLI subprocess after this long with no traffic. The session
  # id is kept, so the next message resumes instead of starting over.
  idle_timeout_s: 900

  # Live CLI subprocesses allowed at once - one per active chat session. Raise
  # only alongside the container's memory limit.
  max_concurrent_cli: 8

  # Agent turns per message before the SDK stops.
  max_turns: 10

  # Optional hard spend cap per session, in USD. 0 disables it.
  max_budget_usd: 0

  # Optional: replaces the built-in incident-response system prompt.
  # system_prompt: |
  #   You are ...
