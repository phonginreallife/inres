# version: "3.9"
# Image version - set INRES_VERSION in .env or defaults to 0.1.0
#
# Agent architecture:
#   - One persistent Claude Agent SDK session per WebSocket connection
#   - That session handles planning, tools, MCP and token streaming in one pass
#
# The .env file belongs NEXT TO THIS FILE - Compose reads it from the directory
# containing the compose file, not from your shell's working directory. Copy
# .env.example from the repo root as a starting point.
#
# Required environment variables (.env):
#   SUPABASE_SERVICE_ROLE_KEY=...
#   SUPABASE_JWT_SECRET=...
#
#   Against a local `supabase start`, the container and network names come from
#   project_id in supabase/config.toml ("inres-oss"), so also set:
#     SUPABASE_NETWORK=supabase_network_inres-oss
#     SUPABASE_URL=http://supabase_kong_inres-oss:8000
#     DATABASE_URL=postgresql://postgres:postgres@supabase_db_inres-oss:5432/postgres?sslmode=disable
#   Confirm the real names with `docker network ls` and `docker ps`.
#
#   Plus exactly one Anthropic credential. An API key takes precedence
#   wherever it is found, so leave it empty to use the OAuth token - and blank
#   anthropic_api_key in volumes/config/dev.config.yaml too, since the agent
#   copies that value into the environment at startup.
#   ANTHROPIC_API_KEY=sk-ant-...            metered, billed per token
#   CLAUDE_CODE_OAUTH_TOKEN=...             from `claude setup-token`

services:
  redis:
    container_name: inres-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - inres-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    container_name: inres-agent
    platform: linux/amd64
    image: ghcr.io/phonginreallife/inres-agent:${INRES_VERSION:-0.1.0}
    expose:
      - "8002"
    volumes:
      - claude_data:/root/.claude
      - ./volumes/config/dev.config.yaml:/app/config.yaml
    environment:
      # Config
      - inres_CONFIG_PATH=/app/config.yaml
      # Anthropic credential - set exactly one. An API key wins if both are
      # present, so leave it empty to use the subscription token.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Service URLs
      - INRES_API_URL=${INRES_API_URL:-http://api:8080}
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase_kong_supabase:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@supabase_db_supabase:5432/postgres?sslmode=disable}
      # Redis
      - REDIS_URL=redis://redis:6379
      # Agent Settings (see ai_agent in the config YAML for the rest)
      - AI_AGENT_MODEL=${AI_AGENT_MODEL:-claude-opus-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AI_RATE_LIMIT=${AI_RATE_LIMIT:-100}
    restart: unless-stopped
    networks:
      - inres-network
      - supabase_network_supabase
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${AGENT_REPLICAS:-1}
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  api:
    container_name: inres-api
    platform: linux/amd64
    image: ghcr.io/phonginreallife/inres-api:${INRES_VERSION:-0.1.0}
    expose:
      - "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./volumes/config/dev.config.yaml:/app/config.yaml
    environment:
      - inres_CONFIG_PATH=/app/config.yaml
    restart: unless-stopped
    networks:
      - inres-network
      - supabase_network_supabase

  slack-worker:
    container_name: inres-slack-worker
    platform: linux/amd64
    image: ghcr.io/phonginreallife/inres-slack-worker:${INRES_VERSION:-0.1.0}
    volumes:
      - ./volumes/config/dev.config.yaml:/app/config.yaml
    restart: unless-stopped
    networks:
      - inres-network

  web:
    container_name: inres-frontend
    platform: linux/amd64
    image: ghcr.io/phonginreallife/inres-frontend:${INRES_VERSION:-0.1.0}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - inres-network

  kong:
    container_name: kong
    platform: linux/amd64
    image: kong:2.8.1
    ports:
      - "8000:8000/tcp"
    volumes:
      - ./volumes/api/kong.yaml:/home/kong/temp.yml:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_DNS_STALE_TTL: "1"
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_ERROR_TTL: "1"
      KONG_DNS_NO_SYNC: "off"
    restart: unless-stopped
    networks:
      - inres-network
    depends_on:
      - api
      - web
      - agent
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

networks:
  inres-network:
    driver: bridge
  # The Supabase CLI names its network after the project_id in
  # supabase/config.toml: supabase_network_<project_id>. This repo's config.toml
  # uses "inres-oss", so a local `supabase start` creates
  # supabase_network_inres-oss, not the self-hosted default below. Set
  # SUPABASE_NETWORK in .env to match whatever `docker network ls` shows.
  supabase_network_supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_network_supabase}

volumes:
  claude_data:
  redis_data:
