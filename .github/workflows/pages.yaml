name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'docs/**'
      - 'scripts/build-docs.sh'
      - '.github/workflows/pages.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'docs/**'
      - 'scripts/build-docs.sh'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble wiki pages
        run: ./scripts/build-docs.sh

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      # Only the deploying branch talks to the Pages API. A pull request just
      # needs to prove the site still compiles, and making it call
      # configure-pages meant every PR failed until Pages was enabled.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet. Without this the
          # action fails with "Get Pages site failed / Not Found" until someone
          # enables Pages by hand in repository settings, which makes a fresh
          # clone or a fork unable to build its own docs.
          enablement: true

      - name: Build with Jekyll
        working-directory: docs
        # On a pull request there is no base_path to read, so fall back to the
        # baseurl in _config.yml.
        run: |
          if [ -n "${{ steps.pages.outputs.base_path }}" ]; then
            bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            bundle exec jekyll build
          fi
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    # A pull request builds to prove the site still compiles, but only main deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
