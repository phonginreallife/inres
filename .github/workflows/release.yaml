name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npx semantic-release` writes nothing to $GITHUB_OUTPUT - the
      # new_release_* outputs come from cycjimmy/semantic-release-action, which
      # this workflow does not use. Without them the trigger-builds job below
      # evaluated `'' == 'true'` and was skipped on every release, so tagged
      # images were never built. Derive the outputs from the tag instead, which
      # keeps semantic-release as the only dependency.
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          npx semantic-release@24
          after="$(git tag --list 'v*' --sort=-v:refname | head -n1)"

          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "Released $after (was ${before:-none})"
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${after#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No new release (still ${after:-none})"
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

  # Trigger Docker builds on new release
  trigger-builds:
    name: Trigger Docker Builds
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Trigger build workflow
        uses: actions/github-script@v7
        with:
          # Prefer a PAT when one is configured. GITHUB_TOKEN is restricted from
          # starting workflow runs in some repository configurations, and a
          # dispatch that silently does nothing is exactly the failure mode that
          # left v1.10.0 without images. Set a RELEASE_PAT secret with
          # `actions: write` to make this deterministic.
          github-token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ needs.release.outputs.new_release_version }}';
            const ref = `v${version}`;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yaml',
              ref,
            });
            core.info(`Dispatched build.yaml at ${ref}`);

            // Confirm a run actually started. Without this the job reports
            // success even when the dispatch was silently dropped, which is
            // what left v1.10.0 without images.
            //
            // This has to poll. listWorkflowRuns is eventually consistent, and
            // a single check after a fixed sleep produces false failures: on
            // v1.13.1 the run was created in the same second as the dispatch,
            // was still absent from the list 16s later, and every image and the
            // chart published fine while this job reported failure. A red X on
            // a release that actually shipped is worse than no check at all -
            // it trains you to ignore the one signal that matters.
            const deadline = Date.now() + 120000;
            let found = false;

            while (!found && Date.now() < deadline) {
              await new Promise((r) => setTimeout(r, 10000));
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yaml',
                event: 'workflow_dispatch',
                per_page: 20,
              });
              found = data.workflow_runs.some((run) => run.head_branch === ref);
              if (!found) core.info(`No run for ${ref} yet; still polling`);
            }

            if (found) {
              core.info(`Build run confirmed for ${ref}`);
            } else {
              core.setFailed(
                `No build run appeared for ${ref} within 2 minutes. The dispatch ` +
                `was accepted but produced no run - configure a RELEASE_PAT ` +
                `secret with actions: write. Check the Actions tab before ` +
                `acting on this: a run that started late is a bug in this ` +
                `check, not in the release.`
              );
            }
