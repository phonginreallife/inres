name: Helm Chart Release

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/helm/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write


env:
  CHART_PATH: deploy/helm/inres
  # Optional: set repository variable HELM_REGISTRY to your OCI registry base (e.g., ghcr.io/<owner>/charts).
  # If not set, we'll default to ghcr.io/<repo_owner>/charts.
  GITHUB_TOKEN: ${{ github.token }}

jobs:

  helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed to resolve the application version below.
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Resolve Helm OCI Repo
        id: resolve_repo
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "helm_repo=oci://ghcr.io/${OWNER_LC}/charts" >> $GITHUB_OUTPUT

      - name: Get Chart Name
        id: get_chart_name
        run: |
          chart_name=$(grep '^name:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}')
          echo "chart_name=${chart_name}" >> $GITHUB_OUTPUT

      - name: Get Chart Version
        id: get_chart_version
        run: |
          chart_version=$(grep '^version:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}')
          echo "chart_version=${chart_version}" >> $GITHUB_OUTPUT

      # appVersion is what every component's image tag falls back to, so a stale
      # value ships a chart that pulls images which may not exist - 0.2.0 was
      # published pointing at 1.10.0, for which no image was ever built. Take it
      # from the newest release tag instead of trusting the checked-in value.
      - name: Resolve App Version
        id: get_app_version
        run: |
          set -euo pipefail
          app_version="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          if [ -z "$app_version" ]; then
            app_version="$(grep '^appVersion:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}' | tr -d '\"')"
            echo "No release tag found; falling back to Chart.yaml appVersion ${app_version}"
          fi
          echo "Packaging with appVersion ${app_version}"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Lint Helm Chart
        run: helm lint "${CHART_PATH}"

      - name: Package and Push Helm Chart
        run: |
          helm package "${CHART_PATH}" --version ${{ steps.get_chart_version.outputs.chart_version }} --app-version ${{ steps.get_app_version.outputs.app_version }}
          helm push ${{ steps.get_chart_name.outputs.chart_name }}-${{ steps.get_chart_version.outputs.chart_version }}.tgz "${{ steps.resolve_repo.outputs.helm_repo }}"